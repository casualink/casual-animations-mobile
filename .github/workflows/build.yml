name: Build AAB for Play Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:stable
    steps:
      - uses: actions/checkout@v4
      - name: Build AAB
        run: |
          rm -rf .buildozer bin
          buildozer -v android release
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: aab-playstore
          path: bin/*.aab
