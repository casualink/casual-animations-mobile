name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:stable
    steps:
      - uses: actions/checkout@v4

      - name: Build APK with Docker Buildozer
        run: |
          # Limpa qualquer cache velho quebrado
          rm -rf .buildozer bin
          # Usa o p4a antigo que funciona, não o 3.14 quebrado
          echo "p4a.branch = v2024.01.21" >> buildozer.spec || true
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
