name: Build AAB for Play Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev wget
          pip install --upgrade pip==23.3.1
          pip install buildozer==1.5.0 Cython==0.29.36

      - name: Fix spec - MATA O capture_logging
        run: |
          # Apaga as linhas velhas que causavam o erro
          sed -i '/p4a.branch/d' buildozer.spec
          sed -i '/p4a.fork/d' buildozer.spec
          # Coloca o p4a NOVO que já foi consertado
          echo "p4a.fork = kivy" >> buildozer.spec
          echo "p4a.branch = develop" >> buildozer.spec
          echo "android.api = 33" >> buildozer.spec
          echo "android.minapi = 21" >> buildozer.spec
          echo "android.ndk = 25b" >> buildozer.spec
          cat buildozer.spec | grep p4a

      - name: Build AAB
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          rm -rf bin .buildozer
          buildozer -v android release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: aab-playstore
          path: bin/*.aab
